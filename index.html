    function renderList(items) {
      const container = document.getElementById("scheduleList");
      container.innerHTML = "";
      
      items.forEach(item => {
        const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.venue)}`;
        const card = `
          <div class="bg-white rounded-xl p-4 border border-slate-200 shadow-sm">
            <div class="flex justify-between items-center pb-2 border-b border-slate-100">
              <span class="text-xs font-bold text-blue-900 bg-blue-50 px-2 py-0.5 rounded">${item.date}</span>
              <span class="text-xs font-semibold text-slate-500">${item.sport}</span>
            </div>
            <div class="mt-2">
              <h3 class="font-bold text-slate-800 text-sm">${item.sub}</h3>
              <p class="text-xs text-slate-500 mt-0.5">🕒 ${item.time}</p>
              <p class="text-xs text-slate-500">📍 ${item.venue}</p>
              <p class="text-xs font-semibold text-emerald-700 mt-1.5">${item.focus}</p>
            </div>
            <div class="mt-3 pt-2 border-t border-slate-100 flex justify-end">
              <a href="${mapUrl}" target="_blank" class="inline-flex items-center text-xs font-medium text-white bg-sky-600 hover:bg-sky-700 px-3 py-1.5 rounded-lg transition-colors">
                📍 開啟導航
              </a>
            </div>
          </div>
        `;
        container.insertAdjacentHTML("beforeend", card);
      });
    }

    function filterSchedule(category) {
      // 變換按鈕樣式
      document.querySelectorAll(".filter-btn").forEach(btn => {
        btn.classList.remove("bg-blue-900", "text-white");
        btn.classList.add("bg-white", "text-slate-700");
      });
      event.target.classList.add("bg-blue-900", "text-white");
      event.target.classList.remove("bg-white", "text-slate-700");

      if (category === "ALL") {
        renderList(scheduleData);
      } else {
        const filtered = scheduleData.filter(item => 
          item.sport.includes(category) || item.focus.includes(category)
        );
        renderList(filtered);
      }
    }

    // 頁面加載完成時初始化
    window.addEventListener("DOMContentLoaded", () => {
      renderList(scheduleData);
      
      // 初始化 LINE LIFF（若有設定 LIFF ID 可填入，非強制）
      if (typeof liff !== "undefined") {
        liff.init({ liffId: "你的LIFF_ID" }).catch(err => {
          console.log("LIFF Init error:", err);
        });
      }
    });
